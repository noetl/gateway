name: "Build Gateway image on Release ⚙️"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v2.10.0"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  # Multi-arch on NATIVE runners, mirroring noetl/server's release.yml
  # (noetl/ai-meta#236, and #245 for this repo).
  #
  # The `platforms: linux/amd64,linux/arm64` one-liner was tried and reverted —
  # it is still here commented out below.  QEMU-emulated arm64 Rust builds are
  # slow enough to blow the job timeout, which is why this uses one native
  # runner per architecture and stitches the manifest afterwards instead.
  #
  # Until this landed the gateway could not be validated on the kind cluster at
  # all: kind here is arm64, so `podman pull --arch arm64` failed outright and
  # the kind deployment held a `pause:3.10` placeholder.  Every gateway change
  # shipped on unit tests alone.
  build_push_image:
    name: build_push_image (${{ matrix.arch_tag }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64
    runs-on: ${{ matrix.runner }}

    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      # Access must be provided on the package level
      # https://github.com/orgs/noetl/packages/container/gateway/settings
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Per-arch image under an arch-suffixed tag; publish-manifest stitches the
      # version + latest manifest list from the pair.  Native runners, so no
      # QEMU and no emulation penalty.
      - name: Build and push (per-arch)
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/noetl/gateway:${{ env.IMAGE_TAG }}-${{ matrix.arch_tag }}

  # Metadata only — combines the two per-arch images into the manifest list that
  # `ghcr.io/noetl/gateway:<tag>` resolves to.  Without this the arch-suffixed
  # tags exist but the plain tag does not, which is worse than before.
  publish-manifest:
    name: publish-manifest
    needs: build_push_image
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push the manifest list
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/noetl/gateway:${IMAGE_TAG}" \
            "ghcr.io/noetl/gateway:${IMAGE_TAG}-amd64" \
            "ghcr.io/noetl/gateway:${IMAGE_TAG}-arm64"
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            docker buildx imagetools create \
              -t "ghcr.io/noetl/gateway:latest" \
              "ghcr.io/noetl/gateway:${IMAGE_TAG}-amd64" \
              "ghcr.io/noetl/gateway:${IMAGE_TAG}-arm64"
          fi

      # Parsed as JSON, not grepped.  The first version matched
      # '"architecture":"..."' with no space after the colon; the raw index is
      # pretty-printed, so it matched nothing and `set -o pipefail` turned that
      # into a job failure while the manifest was in fact CORRECT.  A false
      # negative is the better direction to fail in, but it is still a check
      # reporting on its own formatting assumption rather than on the artifact.
      - name: Verify both architectures are in the manifest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "ghcr.io/noetl/gateway:${IMAGE_TAG}" --raw > /tmp/idx.json
          python3 - <<'EOF'
          import json, sys
          idx = json.load(open("/tmp/idx.json"))
          arches = {
              m.get("platform", {}).get("architecture")
              for m in idx.get("manifests", [])
          } - {None, "unknown"}
          print("manifest architectures:", sorted(arches))
          missing = {"amd64", "arm64"} - arches
          if missing:
              sys.exit(f"MISSING {sorted(missing)} — publishing one arch is the defect #245 fixed")
          EOF
